sonar.projectKey=smarttrader-algotrading
sonar.projectName=SmartTrader AlgoTrading
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.sources=backend/app,backend/start_server.py,frontend/app,frontend/components,frontend/hooks,frontend/lib,frontend/features
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/**/*.spec.ts,frontend/**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/.git/**,**/frontend/out/**,**/archive/**,**/htmlcov/**,**/logs/**,**/.scannerwork/**,**/data_system/**,**/frontend/tsconfig.tsbuildinfo
