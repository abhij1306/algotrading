# detection; remove these lines with the legacy originals.
sonar.cpd.exclusions=backend/app/hat/clock.py,backend/app/hat/money.py,backend/app/hat/data/ratios.py,backend/app/hat/backtest/metrics.py,backend/tests/hat/fakes/broker.py,backend/tests/hat/fakes/data_socket.py
