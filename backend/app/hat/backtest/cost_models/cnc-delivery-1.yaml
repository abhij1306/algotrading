# NSE delivery (CNC) charges for the backtest cost model (09 §2, HAT-BT-023).
# [OWNER-PENDING] every rate below: the owner confirms them against the current statutory and
# exchange schedules and the broker's tariff. A change of any rate is a new file with a new
# version; a run records the version and the hash of the file it used.
version: cnc-delivery-1
gst_rate: "0.18"                 # GST on the components marked taxable
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}          # 0.1% delivery
  - {name: stamp_duty, sides: [buy], rate: "0.00015", taxable: false}       # 0.015% on buys
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000297", taxable: true}  # NSE 0.00297%
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000001", taxable: true}   # Rs 10 per crore
