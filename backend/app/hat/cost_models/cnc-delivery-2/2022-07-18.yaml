# NSE delivery (CNC) charges in force from 2022-07-18 until the next file's effective_from.
# Change: GST on the SEBI turnover fee (Notification 04/2022-CT(Rate)). Sources: docs/backtests/costs.md.
version: cnc-delivery-2
effective_from: "2022-07-18"
gst_rate: "0.18"  # GST 18% on financial services (CGST + SGST / IGST Acts 2017)
dp_per_sell_day: "14.75"  # Fyers Rs 12.50 + 18% GST per scrip per sell day, flat, tax included
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}  # 0.1% delivery, Finance Act 2004 s.98 as amended 2013
  - {name: stamp_duty, sides: [buy], rate: "0.00015", taxable: false}  # 0.015% on buys, Indian Stamp Act as amended by Finance Act 2019
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000345", taxable: true}  # NSE 0.00345%, NSE/FA/46730
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000001", taxable: true}  # Rs 10 per crore, SEBI/LAD-NRO/GN/2019/03
