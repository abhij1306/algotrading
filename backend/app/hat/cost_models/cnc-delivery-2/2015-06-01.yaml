# NSE delivery (CNC) charges in force from 2015-06-01 until the next file's effective_from.
# Change: service tax 14% (Finance Act 2015). Sources: docs/backtests/costs.md.
version: cnc-delivery-2
effective_from: "2015-06-01"
gst_rate: "0.14"  # service tax 14%, cesses subsumed (Finance Act 2015; Notification 14/2015-ST)
dp_per_sell_day: "17.67"  # Fyers Rs 15.50 + 14% service tax per scrip per sell day, flat, tax included (tariff before 2016 not published)
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}  # 0.1% delivery from 2012-07-01, Finance Act 2012 (NSE/FATAX/20990)
  - {name: stamp_duty, sides: [buy, sell], rate: "0.0001", taxable: false}  # 0.01% both sides, Maharashtra Stamp Act Sch. I Art. 51A(b)(i)
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000325", taxable: true}  # NSE Rs 3.25 per lakh from 2009-10-01, NSE/F&A/13028 (first slab)
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000002", taxable: false}  # Rs 20 per crore, 0.0002% (SEBI (Stock Brokers and Sub-brokers) (Third Amendment) Regulations 2006, as amended 2006-09-25); untaxed
