# NSE delivery (CNC) charges in force from 2012-04-01 until the next file's effective_from.
# Change: service tax 12% (Finance Act 2012). Sources: docs/backtests/costs.md.
version: cnc-delivery-2
effective_from: "2012-04-01"
gst_rate: "0.1236"  # service tax 12% + education cess 2% + SHE cess 1% (Finance Act 2012, s.66 as amended from 2012-04-01)
dp_per_sell_day: "17.42"  # Fyers Rs 15.50 + 12.36% service tax per scrip per sell day, flat, tax included (tariff before 2016 not published)
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.00125", taxable: false}  # 0.125% delivery, Finance (No. 2) Act 2004 s.98, to 2012-06-30
  - {name: stamp_duty, sides: [buy, sell], rate: "0.0001", taxable: false}  # 0.01% both sides, Maharashtra Stamp Act Sch. I Art. 51A(b)(i)
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000325", taxable: true}  # NSE Rs 3.25 per lakh from 2009-10-01, NSE/F&A/13028 (first slab)
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000002", taxable: false}  # Rs 20 per crore, 0.0002% (SEBI (Stock Brokers and Sub-brokers) (Third Amendment) Regulations 2006, as amended 2006-09-25); untaxed
