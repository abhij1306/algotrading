# NSE delivery (CNC) charges in force from 2017-04-01 until the next file's effective_from.
# Change: SEBI turnover fee Rs 15 per crore. Sources: docs/backtests/costs.md.
version: cnc-delivery-2
effective_from: "2017-04-01"
gst_rate: "0.15"  # service tax 14% + SB cess 0.5% + Krishi Kalyan cess 0.5% (Finance Act 2016)
dp_per_sell_day: "17.83"  # Fyers Rs 15.50 + 15% service tax per scrip per sell day, flat, tax included
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}  # 0.1% delivery, Finance Act 2004 s.98 as amended 2013
  - {name: stamp_duty, sides: [buy, sell], rate: "0.0001", taxable: false}  # 0.01% both sides, Maharashtra Stamp Act Sch. I Art. 51A(b)(i)
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000325", taxable: true}  # NSE 0.00325% (Rs 3.25 per lakh)
  - {name: sebi_fee, sides: [buy, sell], rate: "0.0000015", taxable: false}  # Rs 15 per crore, SEBI/LAD-NRO/GN/2016-17/038; no GST before 2022-07-18
