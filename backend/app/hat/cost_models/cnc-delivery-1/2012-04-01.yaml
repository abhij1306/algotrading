# NSE delivery (CNC) charges in force from 2012-04-01 until the next file's effective_from.
# Change: service tax 12% (Finance Act 2012). Sources and conventions: docs/decisions.md (Dated cost schedule).
version: cnc-delivery-1
effective_from: "2012-04-01"
gst_rate: "0.1236"  # service tax 12% + education cess 2% + SHE cess 1% (Finance Act 2012, s.66 as amended from 2012-04-01)
dp_per_sell_day: "14.75"  # Rs 12.50 + 18% GST per scrip per sell day, flat, GST included
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.00125", taxable: false}  # 0.125% delivery, Finance (No. 2) Act 2004 s.98, to 2012-06-30
  - {name: stamp_duty, sides: [buy, sell], rate: "0.00005", taxable: false}  # 0.005%, Maharashtra Stamp Act 1958 Sch. I Art. 5 (HAT convention)
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000325", taxable: true}  # NSE Rs 3.25 per lakh from 2009-10-01, NSE/F&A/13028 (first slab)
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000001", taxable: true}  # Rs 10 per crore, SEBI (Stock Brokers) Regulations Sch. III
