# NSE delivery (CNC) charges in force from 2016-01-01 until the next file's effective_from.
# Change: none (the first file of the 2016 backtest window). Sources and conventions: docs/decisions.md (Dated cost schedule).
version: cnc-delivery-1
effective_from: "2016-01-01"
gst_rate: "0.145"  # service tax 14% + Swachh Bharat cess 0.5% (Finance Act 2015)
dp_per_sell_day: "14.75"  # Rs 12.50 + 18% GST per scrip per sell day, flat, GST included
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}  # 0.1% delivery, Finance Act 2013
  - {name: stamp_duty, sides: [buy, sell], rate: "0.00005", taxable: false}  # 0.005%, Maharashtra Stamp Act 1958 Sch. I Art. 5 (HAT convention)
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000325", taxable: true}  # NSE 0.00325% (Rs 3.25 per lakh)
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000001", taxable: true}  # Rs 10 per crore, SEBI (Stock Brokers) Regulations Sch. III
