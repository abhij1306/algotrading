# NSE delivery (CNC) charges in force from 2021-04-01 until the next file's effective_from.
# Change: SEBI turnover fee back to Rs 10 per crore (the relief ended 2021-03-31). Sources and conventions: docs/decisions.md (Dated cost schedule).
version: cnc-delivery-1
effective_from: "2021-04-01"
gst_rate: "0.18"  # GST 18% on financial services (CGST + SGST / IGST Acts 2017)
dp_per_sell_day: "14.75"  # Rs 12.50 + 18% GST per scrip per sell day, flat, GST included
components:
  - {name: brokerage, sides: [buy, sell], rate: "0", per_order: "0", taxable: true}
  - {name: stt, sides: [buy, sell], rate: "0.001", taxable: false}  # 0.1% delivery, Finance Act 2013
  - {name: stamp_duty, sides: [buy], rate: "0.00015", taxable: false}  # 0.015% on buys, Indian Stamp Act as amended by Finance Act 2019
  - {name: exchange_txn, sides: [buy, sell], rate: "0.0000345", taxable: true}  # NSE 0.00345%: the 6% increase of 2021-01-01
  - {name: sebi_fee, sides: [buy, sell], rate: "0.000001", taxable: true}  # Rs 10 per crore, SEBI (Stock Brokers) Regulations Sch. III
