[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
# Coverage is opt-in: pass --cov=app --cov-report=term-missing:skip-covered (CI does).
# Its settings live in pyproject.toml ([tool.coverage.*]).
addopts =
    -v
    --strict-markers
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    postgres: Needs a real Postgres; skipped unless SMARTTRADER_PG_TESTS=1 (CI backend-postgres job)
