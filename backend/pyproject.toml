[project]
name = "hat-backend"
version = "1.0.0"
description = "Hire a Trader (HAT) backend"
requires-python = ">=3.11"

[tool.ruff]
# Ruff configuration for the backend
line-length = 100
target-version = "py311"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "dist",
    "build",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
]

# Ignore specific rules
ignore = [
    "S101",    # Use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, and fake credentials in fixtures are not secrets
"tests/*" = ["S101", "S105", "S106"]
"test_*.py" = ["S101"]

# Allow print statements in scripts
"scripts/*" = ["T20"]

[tool.ruff.lint.flake8-annotations]
# Don't require return type annotations for functions that return Any
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.lint.isort]
# isort configuration
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
