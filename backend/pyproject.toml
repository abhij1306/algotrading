[project]
name = "smarttrader-backend"
version = "1.0.0"
description = "SmartTrader Backend - Quantitative Trading Platform"
requires-python = ">=3.11"

[tool.ruff]
# Ruff configuration for SmartTrader backend
line-length = 100
target-version = "py311"

# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
]

# Ignore specific rules
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "S101",    # Use of assert (allowed in tests)
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "migrations",
    "dist",
    "build",
]

# Note: For symbol format checking (SYM001-SYM003), use the custom checker:
#   python scripts/check_symbol_format.py
# See scripts/ruff_integration.md for integration details

[tool.ruff.per-file-ignores]
# Allow assert statements in tests
"tests/*" = ["S101"]
"test_*.py" = ["S101"]

# Allow print statements in scripts
"scripts/*" = ["T20"]

[tool.ruff.flake8-annotations]
# Don't require return type annotations for functions that return Any
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.isort]
# isort configuration
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=0",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
