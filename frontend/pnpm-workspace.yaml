packages:
  # openapi-typescript needs the TypeScript 5 JS compiler API, which TypeScript 7 (native)
  # no longer ships, so the generator lives in its own package with its own TypeScript.
  - tools/openapi-gen
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
