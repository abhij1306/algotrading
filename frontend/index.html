<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved (else system) theme before first paint. Mirrors lib/theme.ts.
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("smarttrader-theme");
        } catch {
          // Storage unavailable: fall back to the system preference.
        }
        if (theme !== "light" && theme !== "dark") {
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional algorithmic trading platform with backtesting, screening, and AI analysis"
    />
    <link rel="icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>SmartTrader - AI-Powered Trading Platform</title>
  </head>
  <body class="font-sans antialiased h-screen">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
