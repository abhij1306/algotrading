name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # fyers-apiv3 pins aiohttp==3.9.3, which does not build on Python 3.14;
        # install it without deps, as scripts/install_backend_deps.py does.
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install fyers-apiv3==3.1.10 --no-deps

      # Run from the repo root: backend/ uses backend/pyproject.toml, and the root
      # ruff.toml applies the same rules to start_dev.py, scripts/ and data_platform/.
      - name: ruff format
        working-directory: .
        run: ruff format --check .

      - name: ruff check
        working-directory: .
        run: ruff check .

      - name: pytest
        run: pytest --durations=10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
