name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Lint, format and the app-level tests (logging, paths, database config, CORS, the 503
    # handlers). Each HAT suite runs exactly once: tests/hat/properties (sharded) and
    # tests/hat/conformance in the verification-* jobs, tests/hat/db in backend-postgres. No
    # coverage: nothing consumes it (Sonar imports no report), so it only cost time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend

      # Run from the repo root: backend/ uses backend/pyproject.toml, and the root
      # ruff.toml applies the same rules to scripts/.
      - name: ruff format
        working-directory: .
        run: ruff format --check .

      - name: ruff check
        working-directory: .
        run: ruff check .

      - name: pytest
        # python -m puts backend/ on sys.path so tests can import `app`.
        run: python -m pytest -n auto --durations=25 --ignore=tests/hat/properties --ignore=tests/hat/conformance

  backend-postgres:
    # Tests marked `postgres` (schema migrations that run against the real DB on every
    # start). They skip everywhere else, so the backend job above never needs a server.
    # Serial on purpose: the tests share one database.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6 # same major as the owner's local server
        env:
          POSTGRES_USER: postgres
          # Throwaway container reachable only from this job: no password, so none is
          # committed (DB_PASSWORD stays unset and defaults to empty).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: smarttrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smarttrader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTTRADER_PG_TESTS: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: smarttrader_test
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend

      - name: pytest (postgres)
        run: python -m pytest -m postgres --durations=10

  # HAT verification (HAT-VER-060), split into parallel jobs so each finishes inside 5 minutes:
  # TLC models, conformance checks, and the Hypothesis properties sharded across a matrix.
  # Not yet required checks: branch protection is configured outside this repo.
  verification-tla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: TLC models (must pass)
        run: verification/tla/run.sh

      - name: TLC broken variants (each must fail)
        run: verification/tla/run.sh --broken

  verification-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend

      - name: Conformance checks
        run: python -m pytest tests/hat/conformance -q -n auto

  verification-properties:
    # Hypothesis properties under the `ci` profile, dealt round-robin over the sorted property
    # files by scripts/ci_property_shards.py. CONF checks that the matrix covers every file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend

      - name: Hypothesis properties (shard ${{ matrix.shard }} of 4)
        run: |
          mapfile -t files < <(python ../scripts/ci_property_shards.py "${{ matrix.shard }}" 4)
          python -m pytest "${files[@]}" -q -n auto --durations=15

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  api-schema:
    # The committed frontend/lib/api/schema.d.ts must match the backend routes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Regenerate API types
        run: pnpm gen:api

      - name: Check API types are up to date
        run: |
          if ! git diff --exit-code -- lib/api/schema.d.ts; then
            echo "::error file=frontend/lib/api/schema.d.ts::API types are stale. Run 'pnpm gen:api' in frontend/ (backend venv active) and commit the result."
            exit 1
          fi
