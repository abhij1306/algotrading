name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock

      - name: Install dependencies
        # Hash-pinned wheels only (scripts/lock_ci_requirements.py). The lock holds
        # fyers-apiv3 without its stale aiohttp==3.9.3 pin, which does not build on 3.14.
        run: |
          python -m pip install --only-binary :all: --require-hashes --no-deps -r requirements-ci.lock

      # Run from the repo root: backend/ uses backend/pyproject.toml, and the root
      # ruff.toml applies the same rules to start_dev.py, scripts/ and data_platform/.
      - name: ruff format
        working-directory: .
        run: ruff format --check .

      - name: ruff check
        working-directory: .
        run: ruff check .

      - name: pytest
        # python -m puts backend/ on sys.path so tests can import `app`.
        run: python -m pytest --durations=10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
