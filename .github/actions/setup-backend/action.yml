name: Set up backend
description: Python 3.14 plus the hash-pinned CI lock, installed with uv (hash checking stays on).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-suffix: backend-lock
        cache-dependency-glob: backend/requirements-ci.lock

    - name: Install dependencies
      # Hash-pinned wheels only (scripts/lock_ci_requirements.py). The lock holds
      # fyers-apiv3 without its stale aiohttp==3.9.3 pin, which does not build on 3.14.
      shell: bash
      working-directory: backend
      run: uv pip install --system --no-build --require-hashes --no-deps -r requirements-ci.lock
