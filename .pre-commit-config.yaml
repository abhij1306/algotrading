# Pre-commit Configuration for SmartTrader (Solo Version)
# Lightweight checks for solo development

repos:
  - repo: local
    hooks:
      # Frontend: ESLint
      - id: eslint
        name: ESLint
        entry: node frontend/node_modules/eslint/bin/eslint.js -c frontend/eslint.config.mjs
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: true

      # Backend: Ruff
      - id: ruff
        name: Ruff
        entry: python -m ruff check --select E9,F63,F7,F82
        language: system
        files: ^backend/.*\.py$
        pass_filenames: true

      # Symbol format check (critical for data integrity)
      - id: symbol-format
        name: Symbol Format
        entry: python scripts/quality-checks/check_symbol_format.py backend/app
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  # Basic hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

# Skip these hooks in CI (they run separately there)
ci:
  skip: [eslint, ruff, symbol-format]
