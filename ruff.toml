# Root ruff config: applies the backend rules (backend/pyproject.toml) to the
# Python outside backend/ (start_dev.py, scripts/, data_platform/).
# Files under backend/ keep using backend/pyproject.toml directly.
extend = "backend/pyproject.toml"
extend-exclude = ["frontend", "archive"]

[lint.extend-per-file-ignores]
# Developer CLIs: stdout is their interface (T20), and they run fixed local
# commands (venv python, pip, pnpm, taskkill) found on PATH (S603/S607).
"scripts/*" = ["T20", "S603"]
"start_dev.py" = ["T20", "S603", "S607"]
