# Hire a Trader deployment (docs/runbook.md, HAT-OPS-040).
#
# Run from the repository root, outside 08:30-15:35 IST on trading days (HAT-OPS-042):
#   python scripts/hat_deploy_guard.py && \
#     docker compose --env-file .env -f deploy/hat/docker-compose.yml up -d --build
# Add `--profile frontend` to also serve the web app.
#
# Secrets stay in the repo-root .env (mode 0600, HAT-OPS-050): services read it through
# env_file, and the few values interpolated below come from `--env-file .env`. Nothing here holds
# a secret. Every published port is bound to 127.0.0.1: reach the box over Tailscale/WireGuard,
# never through an open port. There is no OpenAlgo service (OWN-20OCT).

name: hat

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      - hat_pgdata:/var/lib/postgresql
    ports:
      # Host-side pg_dump for scripts/hat_backup.py; loopback only.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: deploy/hat/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Overrides of .env for the container network; none is a secret.
      DB_HOST: postgres
      DB_PORT: "5432"
      HAT_ENABLED: "true"
      HAT_DATA_ROOT: /data/hat
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
    volumes:
      - hat_data:/data/hat
      - hat_fyers:/app/fyers/config
      - hat_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Give the lifespan time to stop the feed, the scheduler and the engine cleanly.
    stop_grace_period: 30s

  frontend:
    profiles: ["frontend"]
    build:
      context: ../..
      dockerfile: deploy/hat/frontend.Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hat_pgdata:
  hat_data:
  hat_fyers:
  hat_logs:
